name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev zlib1g-dev \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1

      - name: Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtquick3d qtmultimedia qtshadertools qtwebsockets'
          cache: true

      - name: Build, test, lint and format
        run: QT_DIR="$QT_ROOT_DIR" ./scripts/check.sh
